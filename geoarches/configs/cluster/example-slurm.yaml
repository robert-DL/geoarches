wandb_mode: offline
use_custom_requeue: False

precision: 16-mixed
batch_size: 1
gpus: 4
cpus: 3


launcher:
    cpus_per_task: 4
    gpus_per_node: ${eval:'min(${cluster.gpus}, 8)'}
    nodes: ${eval:'1 + (${cluster.gpus}-1) // 8'}
    tasks_per_node: ${eval:'min(${cluster.gpus}, 8)'}
    mem_gb: ${eval:'32 * min(${cluster.gpus}, 8)'}
    timeout_min: 1440
    name: ${name}
    slurm_constraint: 
    slurm_account: 
    slurm_additional_parameters:
      hint: nomultithread
    slurm_srun_args:
      - "--cpu-bind=none"
      - "--mem-bind=none"
      # Without this, srun scopes CUDA_VISIBLE_DEVICES down to a single GPU per
      # task, so each task only sees 1 local device and Lightning's "auto"
      # strategy silently falls back to SingleDeviceStrategy instead of DDP
      # (no process group, no DistributedSampler, full dataset per task).
      - "--gpu-bind=none"
