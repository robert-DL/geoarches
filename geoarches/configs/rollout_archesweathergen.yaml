modelpaths: ${oc.env:GEOARCHES}/modelstore/aimip-archesweathergen
rollout_domain: "aimip_rollout"
# Ensemble size for this generative model: num_members seeded samples of the
# same model, spread round-robin across the available GPUs (independent of
# GPU count -- unlike rollout.yaml's modelpaths-based ensembling).
num_members: 4

rollout:
  _target_: geoarches.inference.rollout.ClimateRollout
  output_path: ${oc.env:GEOARCHES}/data/outputs/climate/aimip-archesweathergen
  member_idx: 0
  scale_input_noise: 1.0
  num_steps: 25

rollout_kwargs:
  start_datestring: "1978-10-01"
  end_datestring:  "1978-12-31"
  freq: "1D"
  inference_time: True